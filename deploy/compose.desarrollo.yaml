# Desarrollo local del Portal de Onboarding de Hefesto.
#
# Levanta PostgreSQL, Redis, la API de Laravel, el trabajador de colas y el frontend de
# Nuxt. Todo con versiones fijadas.
#
# Estos comandos NO se han ejecutado: el entorno donde se construyó el portal no tenía
# Docker. Ver docs/10-PRUEBAS-Y-ESTADO.md.

name: portal-onboarding-desarrollo

services:

  # -------------------------------------------------------------------------
  # PostgreSQL.
  #
  # DOS ROLES, Y NO UNO
  # -------------------
  # `POSTGRES_USER` es el rol de ARRANQUE: la imagen oficial ejecuta
  # `initdb --username="$POSTGRES_USER"` y ese rol nace superusuario. Solo
  # se usa para crear la base y para las tareas administrativas. La
  # aplicacion NUNCA conecta con el.
  #
  # El rol de la aplicacion (`DB_USERNAME`) lo crea
  # `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
  # NOSUPERUSER y NOBYPASSRLS explicitos. Le da la propiedad de la base
  # para que las migraciones de Laravel puedan crear el esquema.
  #
  # POR QUE IMPORTA: la documentacion de PostgreSQL 18 dice que los
  # superusuarios "always bypass the row security system", y que
  # `FORCE ROW LEVEL SECURITY` sujeta solo al DUENO de la tabla, no al
  # superusuario. Con un solo rol las politicas no se aplicarian y el
  # aislamiento entre empresas seria decorativo. Ver docs/03.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      POSTGRES_DB: portal_onboarding
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-portal_onboarding_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el .env}
      # Rol con el que conecta la aplicacion. Lo crea el script de arranque.
      APP_DB_ROLE: ${DB_USERNAME:-portal}
      APP_DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_onboarding"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interna]

  redis:
    image: redis:7.4.0-alpine3.20
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?define REDIS_PASSWORD en .env}
      --appendonly yes
    volumes:
      - datos-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interna]

  api:
    build:
      context: ../api
      dockerfile: ../deploy/api.Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?define APP_KEY con php artisan key:generate}
      APP_URL: ${APP_URL:-http://127.0.0.1:3000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: portal_onboarding
      DB_USERNAME: portal
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      COOKIE_URL_BASE: ${APP_URL:-http://127.0.0.1:3000}
      COOLIFY_URL_BASE: ${COOLIFY_URL_BASE:-}
      COOLIFY_TOKEN: ${COOLIFY_TOKEN:-}
      COOLIFY_HABILITADA: ${COOLIFY_HABILITADA:-false}
      COOLIFY_PERMITIR_DESPLIEGUE: "false"
      COOLIFY_SERVIDOR_UUID: ${COOLIFY_SERVIDOR_UUID:-}
      INFISICAL_URL_BASE: ${INFISICAL_URL_BASE:-}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_HABILITADA: "false"
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_HABILITADO: ${NTFY_HABILITADO:-false}
      AUTHENTIK_URL: ${AUTHENTIK_URL:-}
      AUTHENTIK_SLUG: ${AUTHENTIK_SLUG:-portal-onboarding}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:-http://127.0.0.1:3000/auth/callback}
      AUTHENTIK_CORREOS_HFESTO: ${AUTHENTIK_CORREOS_HFESTO:-}
      AUTHENTIK_DOMINIOS_HFESTO: ${AUTHENTIK_DOMINIOS_HFESTO:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks: [interna, publica]
    command: php -S 0.0.0.0:8000 -t public

  cola:
    build:
      context: ../api
      dockerfile: ../deploy/api.Dockerfile
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: portal_onboarding
      DB_USERNAME: portal
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      COOLIFY_HABILITADA: ${COOLIFY_HABILITADA:-false}
      INFISICAL_HABILITADA: "false"
      NTFY_HABILITADO: "false"
      AUTHENTIK_URL: ${AUTHENTIK_URL:-}
      AUTHENTIK_SLUG: ${AUTHENTIK_SLUG:-portal-onboarding}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:-http://127.0.0.1:3000/auth/callback}
      AUTHENTIK_CORREOS_HFESTO: ${AUTHENTIK_CORREOS_HFESTO:-}
      AUTHENTIK_DOMINIOS_HFESTO: ${AUTHENTIK_DOMINIOS_HFESTO:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [interna]
    command: php artisan queue:work --queue=aprovisionamiento,credenciales,notificaciones --tries=2

  web:
    build:
      context: ../web
      dockerfile: ../deploy/web.Dockerfile
    environment:
      NUXT_API_BASE: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    networks: [interna, publica]

volumes:
  datos-postgres:
  datos-redis:

networks:
  interna:
    internal: true
  publica: